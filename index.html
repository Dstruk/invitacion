<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dstruk | Exclusive Invitation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-glow"></div>
    <div class="bg-particles"></div>

    <!-- Futuristic Seal / Entrance -->
    <div id="entrance-wrapper" onclick="openInvitation()">
        <div class="digital-seal">
            <div class="seal-inner">
                <div class="rings">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                </div>
                <div class="core">
                    <div class="glitch-text" data-text="ACCESS">ACCESS</div>
                </div>
            </div>
            <p class="instruction">ENCRYPTED MESSAGE RECEIVED<br><span>TAP TO DECRYPT</span></p>
        </div>
    </div>

    <!-- Main Content (Glassmorphism UI) -->
    <div id="main-content" class="hidden">
        <div class="glass-card">
            <div class="scanner-line"></div>
            <header>
                <p class="eyebrow">LIMITED ACCESS EVENT</p>
                <h1 class="glitch-title">DSTRUK</h1>
                <div class="divider"></div>
            </header>

            <div class="info-grid">
                <div class="info-item">
                    <span class="label">TIMELINE</span>
                    <p class="value">JULY 26. 2026</p>
                    <p class="sub-value">20:00 HRS</p>
                </div>

                <div class="info-item">
                    <span class="label">COORDINATES</span>
                    <p class="value">NEO STATION 01</p>
                    <p class="sub-value">AV. FUTURA 777, CP 001</p>
                </div>
            </div>

            <div class="action-area">
                <a href="https://maps.google.com" target="_blank" class="cyber-btn secondary">
                    <span class="btn-content">GPS LOCATION</span>
                </a>
                <a href="https://wa.me/521?text=ACCESS_CONFIRMED_DSTRUK" class="cyber-btn primary">
                    <span class="btn-content">CONFIRM ACCESS</span>
                </a>
            </div>
            
            <p class="footer-code">UID: 0x88F2...A9B</p>
        </div>
    </div>

    <script>
        function openInvitation() {
            const entrance = document.getElementById('entrance-wrapper');
            const content = document.getElementById('main-content');
            
            entrance.classList.add('authorized');
            
            setTimeout(() => {
                entrance.style.display = 'none';
                content.classList.remove('hidden');
                content.classList.add('reveal');
            }, 800);
        }
    </script>
</body>
</html>
