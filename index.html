<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIA MILAGROS | EXCLUSIVE ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a1;
            --secondary: #fbb1bd;
            --accent: #ffd700;
            --dark-overlay: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Rajdhani', sans-serif; height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: background 1s ease; }

        /* Slideshow */
        .slideshow { position: fixed; inset: 0; z-index: 1; }
        .slideshow img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease, transform 10s linear; }
        .slideshow img.active { opacity: 1; transform: scale(1.1); }

        /* Dynamic Effects Container */
        #fx-canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

        /* Theme Overlays */
        .theme-overlay { position: fixed; inset: 0; z-index: 3; transition: all 1s ease; }

        /* --- 10 IMPACTFUL THEMES --- */
        .t1 .theme-overlay { background: radial-gradient(circle, transparent 20%, var(--primary) 150%); } /* Cyber Pink */
        .t2 .theme-overlay { background: linear-gradient(45deg, rgba(255,133,161,0.2), rgba(112,0,255,0.2)); } /* Aurora */
        .t3 .theme-overlay { backdrop-filter: contrast(1.2) saturate(1.5); } /* High Vibe */
        .t4 .theme-overlay { background-image: radial-gradient(var(--accent) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.3; } /* Gold Grid */
        .t5 .theme-overlay { background: linear-gradient(to bottom, transparent, var(--primary)); opacity: 0.4; } /* Sunset Glow */
        .t6 .theme-overlay { filter: hue-rotate(90deg); } /* Emerald Future */
        .t7 .theme-overlay { backdrop-filter: blur(5px) grayscale(0.5); } /* Noir Luxury */
        .t8 .theme-overlay { background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); } /* Retro TV */
        .t9 .theme-overlay { background: radial-gradient(circle at center, transparent, #000 120%); } /* Cinematic Focus */
        .t10 .theme-overlay { backdrop-filter: sepia(0.3) brightness(1.1); } /* Vintage Gold */

        /* HUD & UI */
        #entrance-wrapper { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s ease; }
        .auth-box { text-align: center; cursor: pointer; padding: 40px; border-radius: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); color: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .glitch { font-family: 'Great Vibes', cursive; font-size: 4rem; text-shadow: 0 0 20px var(--primary); margin-bottom: 20px; }
        .trigger-ring { width: 100px; height: 100px; border: 3px solid var(--primary); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,133,161,0.7); } 70% { box-shadow: 0 0 0 20px rgba(255,133,161,0); } 100% { box-shadow: 0 0 0 0 rgba(255,133,161,0); } }

        /* Content */
        #main-content { z-index: 200; width: 90%; max-width: 400px; display: none; opacity: 0; transform: translateY(30px); transition: 0.8s ease; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 30px; padding: 40px 25px; text-align: center; border: 2px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .main-title { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--primary); }
        .data-row { border-left: 4px solid var(--primary); padding: 10px 15px; text-align: left; margin: 20px 0; background: rgba(255,133,161,0.05); }
        .btn { display: block; padding: 18px; margin-top: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; letter-spacing: 2px; text-align: center; transition: 0.3s; }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.secondary { border: 2px solid var(--primary); color: var(--primary); }
    </style>
</head>
<body class="t1">

    <div class="slideshow" id="slideshow">
        <img src="app/img/foto1.jpg" class="active">
        <img src="app/img/foto2.jpg">
        <img src="app/img/foto3.jpg">
        <img src="app/img/foto4.jpg">
        <img src="app/img/foto5.jpg">
        <img src="app/img/foto6.jpg">
    </div>

    <div class="theme-overlay"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="entrance-wrapper">
        <div class="auth-box" onclick="openInvitation()">
            <h1 class="glitch">Sofia Milagros</h1>
            <div class="trigger-ring">
                <span style="font-family: Orbitron; font-size: 0.8rem; letter-spacing: 2px;">INIT</span>
            </div>
            <p style="margin-top: 20px; letter-spacing: 3px; font-weight: bold;">TOCA PARA ENTRAR</p>
        </div>
    </div>

    <div id="main-content">
        <div class="glass-card">
            <h1 class="main-title">Sofia Milagros</h1>
            <p style="letter-spacing: 5px; font-size: 0.8rem; color: #888; margin-bottom: 20px;">GIL MANJARREZ</p>
            <div class="data-block">
                <div class="data-row">
                    <span style="font-size: 0.7rem; color: var(--primary); font-weight: bold; display: block;">FECHA / HORA</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">26.07.2026 / 20:00</p>
                </div>
                <div class="data-row">
                    <span style="font-size: 0.7rem; color: var(--primary); font-weight: bold; display: block;">LOCALIZACIÓN</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">CASA DE SOFÍA</p>
                </div>
            </div>
            <a href="https://wa.me/521?text=CONFIRMO_ASISTENCIA_SOFIA" class="btn primary">CONFIRMAR ACCESO</a>
            <a href="https://maps.google.com" class="btn secondary">UBICACIÓN GPS</a>
        </div>
    </div>

    <script>
        // Random Theme Selection on Load
        const themes = ['t1', 't2', 't3', 't4', 't5', 't6', 't7', 't8', 't9', 't10'];
        const randomTheme = themes[Math.floor(Math.random() * themes.length)];
        document.body.className = randomTheme;

        // Slideshow Logic with Zoom Effect
        const imgs = document.querySelectorAll('.slideshow img');
        let cur = 0;
        setInterval(() => {
            imgs[cur].classList.remove('active');
            cur = (cur + 1) % imgs.length;
            imgs[cur].classList.add('active');
        }, 5000);

        function openInvitation() {
            const entrance = document.getElementById('entrance-wrapper');
            const content = document.getElementById('main-content');
            entrance.style.opacity = '0';
            entrance.style.transform = 'scale(1.2)';
            setTimeout(() => {
                entrance.style.display = 'none';
                content.style.display = 'block';
                setTimeout(() => {
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 50);
            }, 800);
        }

        // Particle System for extra "Impact"
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 133, 161, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function init() {
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        init(); animate();
    </script>
</body>
</html>
