<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Invitación Digital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>¡Nos Casamos!</h1>
            <p class="names">Ana & Juan</p>
        </header>

        <section class="details">
            <div class="date">
                <h2>Fecha</h2>
                <p>Sábado, 15 de Julio de 2024</p>
                <p>18:00 Horas</p>
            </div>

            <div class="location">
                <h2>Lugar</h2>
                <p>Hacienda Los Olivos</p>
                <p>Calle Principal #123, Ciudad</p>
                <a href="https://maps.google.com" target="_blank" class="btn-link">Ver ubicación</a>
            </div>
        </section>

        <section class="rsvp">
            <h2>Confirmar Asistencia</h2>
            <p>Por favor, confírmanos tu asistencia antes del 1 de Junio.</p>
            <a href="https://wa.me/1234567890?text=Hola!%20Confirmo%20mi%20asistencia" class="btn-rsvp">Confirmar por WhatsApp</a>
        </section>
    </div>
</body>
</html>
