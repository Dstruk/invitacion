<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIA MILAGROS | THE EXPERIENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a1;
            --accent: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Rajdhani', sans-serif; height: 100vh; width: 100vw; overflow: hidden; }

        /* --- CONTENEDOR DE EDICIONES (SCENES) --- */
        #stage { position: fixed; inset: 0; z-index: 1; }
        
        .photo-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: none;
            transition: opacity 1s ease;
        }
        .photo-frame.active { display: block; opacity: 1; }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- EDICIÓN 1: KEN BURNS ZOOM --- */
        .edit-kenburns img { animation: kenburns 8s linear infinite alternate; }
        @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.3) translate(20px, 10px); } }

        /* --- EDICIÓN 2: GLITCH SPLIT --- */
        .edit-glitch { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
        .edit-glitch.active img { animation: glitch-anim 0.4s infinite; }
        @keyframes glitch-anim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(180deg); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        /* --- EDICIÓN 3: 3D TILT --- */
        .edit-3d { perspective: 1000px; }
        .edit-3d img { animation: tilt-3d 5s ease-in-out infinite alternate; }
        @keyframes tilt-3d { from { transform: rotateY(-15deg) rotateX(5deg); } to { transform: rotateY(15deg) rotateX(-5deg); } }

        /* --- EDICIÓN 4: VERTICAL SLIDE --- */
        .edit-vslide img { animation: v-slide 10s ease-in-out infinite; }
        @keyframes v-slide { 0%, 100% { object-position: center top; } 50% { object-position: center bottom; } }

        /* --- EDICIÓN 5: MIRROR MULTI (GRID) --- */
        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .edit-grid .clone { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .edit-grid .clone img { position: absolute; width: 200%; height: 200%; object-fit: cover; }
        .edit-grid .c1 img { top: 0; left: 0; }
        .edit-grid .c2 img { top: 0; right: 0; }
        .edit-grid .c3 img { bottom: 0; left: 0; }
        .edit-grid .c4 img { bottom: 0; right: 0; }

        /* --- UI & ENTRANCE --- */
        #overlay { position: fixed; inset: 0; z-index: 10; background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8)); pointer-events: none; }
        
        #entrance-wrapper { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); }
        .auth-card { text-align: center; cursor: pointer; padding: 40px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,133,161,0.1); }
        .name-glitch { font-family: 'Great Vibes', cursive; font-size: 4rem; color: #fff; text-shadow: 0 0 20px var(--primary); }
        
        #main-content { position: fixed; bottom: -100%; left: 0; width: 100%; height: 80vh; z-index: 200; transition: 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        .glass-sheet { height: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(30px); border-top-left-radius: 50px; border-top-right-radius: 50px; padding: 50px 30px; text-align: center; }
        
        .btn { display: block; padding: 20px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .btn-p { background: var(--primary); color: #fff; }
        .btn-s { border: 2px solid var(--primary); color: var(--primary); }

        .active-content { bottom: 0 !important; }
    </style>
</head>
<body>

    <!-- Fondos Dinámicos -->
    <div id="stage">
        <!-- Las fotos se inyectan por JS para aplicar los estilos de edición -->
    </div>

    <div id="overlay"></div>

    <div id="entrance-wrapper" onclick="startExperience()">
        <div class="auth-card">
            <h1 class="name-glitch">Sofia Milagros</h1>
            <div style="width: 80px; height: 80px; border: 2px solid #fff; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite;">
                <span style="font-family: Orbitron; font-size: 0.7rem;">INIT</span>
            </div>
            <p style="color: #fff; letter-spacing: 5px; font-size: 0.8rem;">TAP TO LAUNCH EDIT</p>
        </div>
    </div>

    <div id="main-content">
        <div class="glass-sheet">
            <h1 style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--primary);">Sofia Milagros</h1>
            <p style="letter-spacing: 5px; color: #888; margin-bottom: 30px;">GIL MANJARREZ</p>
            
            <div style="text-align: left; margin-bottom: 40px;">
                <div style="border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 20px;">
                    <span style="color: var(--primary); font-size: 0.7rem; font-weight: bold;">TIMELINE</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">26.07.2026 / 20:00</p>
                </div>
                <div style="border-left: 4px solid var(--primary); padding-left: 15px;">
                    <span style="color: var(--primary); font-size: 0.7rem; font-weight: bold;">NODE COORDINATES</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">CASA DE SOFÍA</p>
                </div>
            </div>

            <a href="https://wa.me/521?text=CONFIRMO_ASISTENCIA" class="btn btn-p">CONFIRM ACCESS</a>
            <a href="https://maps.google.com" class="btn btn-s">MAPS LOCATION</a>
        </div>
    </div>

    <script>
        const photos = [
            'app/img/foto1.jpg', 'app/img/foto2.jpg', 'app/img/foto3.jpg', 
            'app/img/foto4.jpg', 'app/img/foto5.jpg', 'app/img/foto6.jpg'
        ];

        // Tipos de "Ediciones" tipo TikTok
        const edits = ['edit-kenburns', 'edit-glitch', 'edit-3d', 'edit-vslide', 'edit-grid'];
        
        const stage = document.getElementById('stage');

        // Generar frames con ediciones aleatorias
        photos.forEach((src, index) => {
            const frame = document.createElement('div');
            const randomEdit = edits[Math.floor(Math.random() * edits.length)];
            frame.className = `photo-frame ${randomEdit}`;
            
            if (randomEdit === 'edit-grid') {
                frame.innerHTML = `
                    <div class="clone c1"><img src="${src}"></div>
                    <div class="clone c2"><img src="${src}"></div>
                    <div class="clone c3"><img src="${src}"></div>
                    <div class="clone c4"><img src="${src}"></div>
                `;
            } else {
                frame.innerHTML = `<img src="${src}">`;
            }
            stage.appendChild(frame);
        });

        const frames = document.querySelectorAll('.photo-frame');
        let current = 0;

        function nextFrame() {
            frames[current].classList.remove('active');
            current = (current + 1) % frames.length;
            frames[current].classList.add('active');
            
            // Cada cambio de foto puede cambiar el estilo de edición
            const randomEdit = edits[Math.floor(Math.random() * edits.length)];
            frames[current].className = `photo-frame active ${randomEdit}`;
        }

        frames[0].classList.add('active');
        setInterval(nextFrame, 4000);

        function startExperience() {
            document.getElementById('entrance-wrapper').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entrance-wrapper').style.display = 'none';
                document.getElementById('main-content').classList.add('active-content');
            }, 800);
        }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </script>
</body>
</html>
