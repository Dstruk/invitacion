<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFIA | EXCLUSIVE ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff85a1;
            --secondary: #fbb1bd;
            --bg: #fffafa;
            --accent: #ffd700;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000; /* Fondo negro para que resalten las fotos */
            color: #4a4a4a;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Slideshow Background */
        .slideshow {
            position: fixed;
            inset: 0;
            z-index: 5;
            background: #000;
        }

        .slideshow img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.7);
        }

        .slideshow img.active {
            opacity: 1;
        }

        /* HUD Overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 133, 161, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 133, 161, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 10;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Entrance Screen Overlay */
        #entrance-wrapper {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            transition: all 1s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .auth-box {
            text-align: center;
            cursor: pointer;
            z-index: 3001;
        }

        .glitch {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #fff;
            text-shadow: 0 0 20px var(--primary), 2px 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .access-trigger {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .trigger-ring {
            position: absolute;
            inset: 0;
            border: 3px solid #fff;
            border-radius: 50%;
            animation: rotate 4s linear infinite;
            box-shadow: 0 0 20px var(--primary);
        }

        .trigger-core {
            position: absolute;
            inset: 30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
        }

        .trigger-core span {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #fff;
            font-weight: bold;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Main Content */
        #main-content {
            width: 90%;
            max-width: 420px;
            z-index: 100;
        }

        .glass-frame {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .main-title { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--primary); }
        .data-row { border-left: 3px solid var(--primary); padding-left: 15px; text-align: left; margin: 25px 0; }
        .label { font-size: 0.7rem; color: var(--primary); font-weight: bold; letter-spacing: 2px; }
        .btn { display: block; padding: 15px; margin-top: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; letter-spacing: 2px; transition: 0.3s; }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.secondary { border: 2px solid var(--primary); color: var(--primary); }
        
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .glitch { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="grid-overlay"></div>

    <!-- Entrance with Slideshow -->
    <div id="entrance-wrapper">
        <div class="slideshow">
            <!-- Corregida la ruta para que apunte a app/img/ -->
            <img src="app/img/foto1.jpg" class="active">
            <img src="app/img/foto2.jpg">
            <img src="app/img/foto3.jpg">
            <img src="app/img/foto4.jpg">
            <img src="app/img/foto5.jpg">
            <img src="app/img/foto6.jpg">
        </div>
        
        <div class="auth-box" onclick="openInvitation()">
            <h1 class="glitch">Sofia Milagros</h1>
            <div class="access-trigger">
                <div class="trigger-ring"></div>
                <div class="trigger-core"><span>INIT</span></div>
            </div>
            <p style="color: #fff; margin-top: 20px; letter-spacing: 3px; font-size: 0.7rem; text-shadow: 1px 1px 3px #000;">TAP TO ENTER</p>
        </div>
    </div>

    <!-- Invitation -->
    <div id="main-content" class="hidden">
        <div class="glass-frame">
            <h1 class="main-title">Sofia Milagros</h1>
            <p style="letter-spacing: 5px; font-size: 0.8rem; margin-bottom: 30px;">GIL MANJARREZ</p>
            
            <div class="data-block">
                <div class="data-row">
                    <span class="label">FECHA // TIME</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">26.07.2026 / 20:00</p>
                </div>
                <div class="data-row">
                    <span class="label">LUGAR // NODE</span>
                    <p style="font-size: 1.2rem; font-weight: bold;">CASA DE SOFÍA</p>
                </div>
            </div>

            <a href="https://wa.me/521?text=CONFIRMO_ASISTENCIA" class="btn primary">CONFIRMAR ASISTENCIA</a>
            <a href="https://maps.google.com" class="btn secondary">COORDINADAS GPS</a>
        </div>
    </div>

    <script>
        // Slideshow Logic
        const images = document.querySelectorAll('.slideshow img');
        let current = 0;
        
        if (images.length > 0) {
            setInterval(() => {
                images[current].classList.remove('active');
                current = (current + 1) % images.length;
                images[current].classList.add('active');
            }, 4000);
        }

        function openInvitation() {
            const wrapper = document.getElementById('entrance-wrapper');
            const content = document.getElementById('main-content');
            wrapper.style.transform = 'translateY(-100%)';
            setTimeout(() => {
                wrapper.style.display = 'none';
                content.classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
